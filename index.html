    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1f6feb, #58a6ff);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 32px;
      font-weight: bold;
      color: white;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #e6edf3;
      margin-bottom: 4px;
    }

    .title {
      font-size: 13px;
      color: #8b949e;
      margin-bottom: 6px;
    }

    .org {
      font-size: 13px;
      color: #58a6ff;
      margin-bottom: 32px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 14px;
      transition: transform 0.15s, opacity 0.15s;
      cursor: pointer;
    }

    .btn:hover { opacity: 0.88; transform: translateY(-1px); }

    .btn-linkedin {
      background: #0a66c2;
      color: white;
    }

    .btn-github {
      background: #21262d;
      color: #e6edf3;
      border: 1px solid #30363d;
    }

    .btn-scholar {
      background: #1a1a8f;
      color: white;
    }

    .btn-resume {
      background: #1a7a4a;
      color: white;
    }

    .icon { width: 22px; height: 22px; flex-shrink: 0; }

    .footer {
      margin-top: 28px;
      font-size: 11px;
      color: #484f58;
    }
  </style>
